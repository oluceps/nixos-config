# Generated by Home Manager.
# See https://sw.kovidgoyal.net/kitty/conf.html
font_family Maple Mono
font_size 13.000000


# Shell integration is sourced and configured manually
shell_integration no-rc

background_opacity 0.8
background_blur 32
confirm_os_window_close 0



shell /run/current-system/sw/bin/herdr
disable_ligatures never
cursor_blink_interval 0.3

# The basic colors
window_padding_width 4
# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

hide_window_decorations yes

foreground               #bfbdb6
background               #0d1017
selection_foreground     #0d1017
selection_background     #bfbdb6

cursor                   #bfbdb6
cursor_text_color        #0d1017

url_color                #53bdfa
visual_bell_color        #e6b450

active_tab_foreground    #0d1017
active_tab_background    #53bdfa
inactive_tab_foreground  #bfbdb6
inactive_tab_background  #0a0000

active_border_color      #53bdfa
inactive_border_color    #5a6378

# black
color0   #0a0000
color8   #5a6378

# red
color1   #ea6c73
color9   #f07178

# green
color2   #91b362
color10  #aad94c

# yellow
color3   #f9af4f
color11  #ffb454

# blue
color4   #53bdfa
color12  #59c2ff

# magenta
color5   #c3a6ff
color13  #d2a6ff

# cyan
color6   #90e1c6
color14  #95e6cb

# white
color7   #bfbdb6
color15  #ffffff

protocol file
ext js,jsx,ts,tsx,rs,c,cpp,cc,json,toml,kt,yaml,yml,sh,fish,nu,nix,lock
action launch --type=overlay $EDITOR $FILE_PATH

protocol file
mime text/plain
action launch --type=overlay $EDITOR $FILE_PATH

# Open directories
protocol file
mime inode/directory
action launch --cwd $FILE_PATH

# Open executable file
protocol file
mime inode/executable,application/vnd.microsoft.portable-executable
action launch --hold --type=overlay $FILE_PATH

# Open text files without fragments in the editor
protocol file
mime text/*
action launch --type=overlay $EDITOR $FILE_PATH

# Open image files with icat
protocol file
mime image/*
action launch --type=overlay kitty +kitten icat --hold $FILE_PATH

# Open video files with vlc
protocol file
mime video/*
action launch --type=os-window vlc $FILE_PATH

# Open ssh URLs with ssh command
protocol ssh
action launch --type=overlay ssh $URL
